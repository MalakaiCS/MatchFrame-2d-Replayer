name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mf
          POSTGRES_PASSWORD: mf
          POSTGRES_DB: matchframe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mf" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mf:mf@localhost:5432/matchframe
      TEST_DATABASE_URL: postgres://mf:mf@localhost:5432/matchframe_test
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      APP_ORIGIN: http://localhost:3000
      STORAGE_DRIVER: fs
      STORAGE_FS_ROOT: ${{ github.workspace }}/.data/objects
      MF_ALLOW_SYNTHETIC: "1"
      AUTH_RATE_LIMIT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Create test database
        run: PGPASSWORD=mf psql -h localhost -U mf -d matchframe -c 'create database matchframe_test'
      - name: Install
        run: |
          cd web && npm ci
          cd ../worker && pip install -e '.[test]'
      - name: Migrate
        run: |
          cd web && npm run migrate
          DATABASE_URL=$TEST_DATABASE_URL npm run migrate
      - name: Worker tests
        run: cd worker && python -m pytest -q
      - name: Type check and unit tests
        run: cd web && npx tsc --noEmit && npx vitest run
      - name: Build
        run: cd web && npx next build
      - name: Start web and worker
        run: |
          cd web && (node .next/standalone/server.js > ../web.log 2>&1 &)
          cp -r .next/static .next/standalone/.next/static
          cd ../worker && (python -m matchframe_worker.main > ../worker.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
      - name: API integration tests
        run: cd web && MF_BASE_URL=http://localhost:3000 npx vitest run
      - name: Browser end-to-end tests
        run: |
          cd web && npx playwright install --with-deps chromium
          MF_BASE_URL=http://localhost:3000 npx playwright test --trace off
      - name: Logs
        if: failure()
        run: tail -100 web.log worker.log
